openapi: 3.0.3

info:
  title: Core REST Service
  description: REST API for the Factory Manager distributed monitoring system.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Auth
    description: Authentication
  - name: Users
    description: User management
  - name: Areas
    description: Area management
  - name: Machines
    description: Machine management

paths:
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Log in and obtain a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Log out (stateless — client discards the token)
      responses:
        '204':
          description: Logged out

  /api/users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      description: Requires an authenticated admin user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UserId'

    get:
      tags: [Users]
      operationId: getUserById
      summary: Get a user by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Users]
      operationId: updateUserById
      summary: Update a user by ID
      description: Requires an authenticated admin user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Users]
      operationId: deleteUserById
      summary: Delete a user by ID
      description: Requires an authenticated admin user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/areas:
    post:
      tags: [Areas]
      operationId: createArea
      summary: Create an area
      description: Requires an authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAreaRequest'
      responses:
        '201':
          description: Area created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Areas]
      operationId: listAreas
      summary: List areas
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of areas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Area'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/areas/{id}:
    parameters:
      - $ref: '#/components/parameters/AreaId'

    get:
      tags: [Areas]
      operationId: getAreaById
      summary: Get an area by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Area found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Areas]
      operationId: updateAreaById
      summary: Update an area by ID
      description: Requires an authenticated user.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAreaRequest'
      responses:
        '200':
          description: Area updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Areas]
      operationId: deleteAreaById
      summary: Delete an area by ID
      description: Requires an authenticated user.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Area deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Area'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/machines:
    post:
      tags: [Machines]
      operationId: createMachine
      summary: Create a machine
      description: Requires an authenticated user with write role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMachineRequest'
      responses:
        '201':
          description: Machine created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Machines]
      operationId: listMachines
      summary: List machines
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: areaId
          in: query
          description: Filter machines by area ID
          schema:
            type: string
            pattern: '^[0-9a-f]{24}$'
      responses:
        '200':
          description: List of machines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Machine'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/machines/{id}:
    parameters:
      - $ref: '#/components/parameters/MachineId'

    get:
      tags: [Machines]
      operationId: getMachineById
      summary: Get a machine by ID
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Machine found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Machines]
      operationId: updateMachineById
      summary: Update a machine by ID
      description: Requires an authenticated user with write role.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMachineRequest'
      responses:
        '200':
          description: Machine updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Machines]
      operationId: deleteMachineById
      summary: Delete a machine by ID
      description: Requires an authenticated user with write role.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Machine deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /api/machines/{id}/state:
    parameters:
      - $ref: '#/components/parameters/MachineId'

    patch:
      tags: [Machines]
      operationId: updateMachineState
      summary: Update machine state
      description: >
        Called by the Coordinator using a service token (`X-Service-Token` header),
        or manually by an authenticated user with write role.
        Invalid state transitions return 422.
      security:
        - bearerAuth: []
        - serviceToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMachineStateRequest'
      responses:
        '200':
          description: Machine state updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Machine'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/InvalidTransition'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

    serviceToken:
      type: apiKey
      in: header
      name: X-Service-Token
      description: Pre-shared token for internal communication

  parameters:
    MachineId:
      name: id
      in: path
      required: true
      description: 24-character hexadecimal MongoDB ObjectId
      schema:
        type: string
        pattern: '^[0-9a-f]{24}$'
        example: '507f1f77bcf86cd799439011'

    UserId:
      name: id
      in: path
      required: true
      description: 24-character hexadecimal MongoDB ObjectId
      schema:
        type: string
        pattern: '^[0-9a-f]{24}$'
        example: '507f1f77bcf86cd799439011'

    AreaId:
      name: id
      in: path
      required: true
      description: 24-character hexadecimal MongoDB ObjectId
      schema:
        type: string
        pattern: '^[0-9a-f]{24}$'
        example: '507f1f77bcf86cd799439011'

  schemas:
    MachineState:
      type: string
      enum: [off, operational, anomaly]
      example: operational

    SensorType:
      type: string
      enum:
        [powerConsumption, emissions, operatingTemperature, vibration, pressure]
      example: vibration

    SpecificationEntry:
      type: object
      required: [measurementUnit, normalRange]
      properties:
        measurementUnit:
          type: string
          example: kW
        normalRange:
          type: object
          required: [min, max]
          description: max must be greater than or equal to min
          properties:
            min:
              type: number
              example: 0
            max:
              type: number
              example: 100

    MachineSpecifications:
      type: object
      required:
        [powerConsumption, emissions, operatingTemperature, vibration, pressure]
      properties:
        powerConsumption:
          $ref: '#/components/schemas/SpecificationEntry'
        emissions:
          $ref: '#/components/schemas/SpecificationEntry'
        operatingTemperature:
          $ref: '#/components/schemas/SpecificationEntry'
        vibration:
          $ref: '#/components/schemas/SpecificationEntry'
        pressure:
          $ref: '#/components/schemas/SpecificationEntry'

    Machine:
      type: object
      required:
        [id, serial, name, location, machineState, specifications, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: '507f1f77bcf86cd799439011'
        serial:
          type: string
          example: MCH-001
        name:
          type: string
          example: Press Alpha
        location:
          type: object
          required: [areaId]
          properties:
            areaId:
              type: string
              example: '507f1f77bcf86cd799439011'
        machineState:
          type: object
          required: [currentState, anomalyDetails]
          properties:
            currentState:
              $ref: '#/components/schemas/MachineState'
            anomalyDetails:
              type: array
              items:
                $ref: '#/components/schemas/SensorType'
              example: []
        specifications:
          $ref: '#/components/schemas/MachineSpecifications'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateMachineRequest:
      type: object
      required: [serial, name, location, specifications]
      properties:
        serial:
          type: string
          example: MCH-001
        name:
          type: string
          example: Press Alpha
        location:
          type: object
          required: [areaId]
          properties:
            areaId:
              type: string
              pattern: '^[0-9a-f]{24}$'
              example: '507f1f77bcf86cd799439011'
        specifications:
          $ref: '#/components/schemas/MachineSpecifications'

    UpdateMachineRequest:
      type: object
      minProperties: 1
      properties:
        serial:
          type: string
          example: MCH-001
        name:
          type: string
          example: Press Beta
        location:
          type: object
          properties:
            areaId:
              type: string
              pattern: '^[0-9a-f]{24}$'
        specifications:
          $ref: '#/components/schemas/MachineSpecifications'

    UpdateMachineStateRequest:
      type: object
      required: [currentState]
      properties:
        currentState:
          $ref: '#/components/schemas/MachineState'
        anomalyDetails:
          type: array
          description: >
            Required and non-empty when currentState is 'anomaly'.
            Ignored (cleared) when transitioning to any other state.
          items:
            $ref: '#/components/schemas/SensorType'

    UserName:
      type: object
      required: [first, last]
      properties:
        first:
          type: string
          example: Mario
        last:
          type: string
          example: Rossi

    User:
      type: object
      required: [id, name, email, role, isActive, lastLoginAt, createdAt, updatedAt, fullName]
      properties:
        id:
          type: string
          example: '507f1f77bcf86cd799439011'
        name:
          $ref: '#/components/schemas/UserName'
        email:
          type: string
          format: email
          example: mario.rossi@fm.com
        role:
          type: string
          enum: [admin, operator]
          example: operator
        isActive:
          type: boolean
          example: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        fullName:
          type: string
          example: Mario Rossi

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          example: mario.rossi@fm.com
        password:
          type: string
          format: password
          example: Password123!

    LoginResponse:
      type: object
      required: [accessToken, tokenType, expiresIn, user]
      properties:
        accessToken:
          type: string
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.e30.signature
        tokenType:
          type: string
          example: Bearer
        expiresIn:
          type: string
          example: 1h
        user:
          $ref: '#/components/schemas/User'

    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        email:
          type: string
          format: email
          example: mario.rossi@fm.com
        password:
          type: string
          format: password
          minLength: 8
          pattern: '^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$'
          description: >
            At least 8 characters containing one letter, one number, and one
            special character (@$!%*#?&).
          example: Password123!
        role:
          type: string
          enum: [admin, operator]
          example: operator

    UpdateUserRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: object
          minProperties: 1
          properties:
            first:
              type: string
              example: Mario
            last:
              type: string
              example: Rossi
        email:
          type: string
          format: email
        password:
          type: string
          format: password
          minLength: 8
          pattern: '^(?=.*[A-Za-z])(?=.*\d)(?=.*[@$!%*#?&])[A-Za-z\d@$!%*#?&]{8,}$'
          description: >
            At least 8 characters containing one letter, one number, and one
            special character (@$!%*#?&).
        role:
          type: string
          enum: [admin, operator]
        isActive:
          type: boolean

    Area:
      type: object
      required: [id, name, size, createdAt, updatedAt]
      properties:
        id:
          type: string
          example: '507f1f77bcf86cd799439011'
        name:
          type: string
          example: Workshop A
        size:
          type: number
          minimum: 1
          example: 200
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAreaRequest:
      type: object
      required: [name, size]
      properties:
        name:
          type: string
          example: Workshop A
        size:
          type: number
          minimum: 1
          example: 200

    UpdateAreaRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          example: Workshop A
        size:
          type: number
          minimum: 1
          example: 200

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            [
              VALIDATION_ERROR,
              NOT_FOUND,
              CONFLICT,
              UNAUTHORIZED,
              FORBIDDEN,
              INTERNAL_ERROR,
              INVALID_TRANSITION
            ]
          example: NOT_FOUND
        message:
          type: string
          example: User not found
        details:
          type: array
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                example: email
              message:
                type: string
                example: '"email" must be a valid email'

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: VALIDATION_ERROR
            message: '"email" must be a valid email'

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: NOT_FOUND
            message: User not found

    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: CONFLICT
            message: A resource with this value already exists

    Unauthorized:
      description: Authentication required or credentials invalid
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: UNAUTHORIZED
            message: Authentication required

    Forbidden:
      description: Insufficient permissions
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: FORBIDDEN
            message: Insufficient permissions

    InvalidTransition:
      description: State transition not allowed from the current machine state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INVALID_TRANSITION
            message: "Transition from 'off' to 'anomaly' is not allowed"

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            code: INTERNAL_ERROR
            message: Internal server error
