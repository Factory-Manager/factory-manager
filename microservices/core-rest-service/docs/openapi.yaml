openapi: 3.0.3

info:
  title: Core REST Service
  description: REST API for the Factory Manager distributed monitoring system.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Service health and readiness checks
  - name: Users
    description: User management

paths:
  /:
    get:
      tags: [Health]
      operationId: getServiceStatus
      summary: Get service status
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'

  /api/health:
    get:
      tags: [Health]
      operationId: getHealthStatus
      summary: Get health status
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/ready:
    get:
      tags: [Health]
      operationId: getReadinessStatus
      summary: Get readiness status
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  /api/users:
    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      responses:
        '200':
          description: List of users
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    ServiceStatus:
      type: object
      properties:
        service:
          type: string
          example: core-rest-service
        status:
          type: string
          example: running

    HealthStatus:
      type: object
      properties:
        service:
          type: string
          example: core-rest-service
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    ReadinessStatus:
      type: object
      properties:
        service:
          type: string
          example: core-rest-service
        ready:
          type: boolean
          example: true
        database:
          type: object
          properties:
            connected:
              type: boolean
              example: true

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          example: INTERNAL_ERROR
        message:
          type: string
          example: Internal server error

  responses:
    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
