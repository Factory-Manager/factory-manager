openapi: 3.0.3

info:
  title: Core REST Service
  description: REST API for the Factory Manager distributed monitoring system.
  version: 0.1.0

servers:
  - url: http://localhost:3000
    description: Local development

tags:
  - name: Health
    description: Service health and readiness checks
  - name: Users
    description: User management

paths:
  /:
    get:
      tags: [Health]
      operationId: getServiceStatus
      summary: Get service status
      responses:
        '200':
          description: Service is running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ServiceStatus'

  /api/health:
    get:
      tags: [Health]
      operationId: getHealthStatus
      summary: Get health status
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthStatus'

  /api/ready:
    get:
      tags: [Health]
      operationId: getReadinessStatus
      summary: Get readiness status
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'
        '503':
          description: Service is not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessStatus'

  /api/users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'

    get:
      tags: [Users]
      operationId: listUsers
      summary: List users
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    ServiceStatus:
      type: object
      properties:
        service:
          type: string
          example: core-rest-service
        status:
          type: string
          example: running

    HealthStatus:
      type: object
      properties:
        service:
          type: string
          example: core-rest-service
        status:
          type: string
          example: ok
        timestamp:
          type: string
          format: date-time

    ReadinessStatus:
      type: object
      properties:
        service:
          type: string
          example: core-rest-service
        ready:
          type: boolean
          example: true
        database:
          type: object
          properties:
            connected:
              type: boolean
              example: true

    UserName:
      type: object
      required: [first, last]
      properties:
        first:
          type: string
          example: Mario
        last:
          type: string
          example: Rossi

    User:
      type: object
      properties:
        id:
          type: string
          example: '507f1f77bcf86cd799439011'
        name:
          $ref: '#/components/schemas/UserName'
        email:
          type: string
          format: email
          example: mario.rossi@fm.com
        role:
          type: string
          enum: [admin, operator]
          example: operator
        isActive:
          type: boolean
          example: true
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
          example: null
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        fullName:
          type: string
          example: Mario Rossi

    CreateUserRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          $ref: '#/components/schemas/UserName'
        email:
          type: string
          format: email
          example: mario.rossi@fm.com
        password:
          type: string
          format: password
          minLength: 8
          description: >
            At least 8 characters containing one letter, one number, and one
            special character (@$!%*#?&).
          example: Password123!
        role:
          type: string
          enum: [admin, operator]
          example: operator

    ErrorResponse:
      type: object
      properties:
        code:
          type: string
          enum: [VALIDATION_ERROR, NOT_FOUND, CONFLICT, INTERNAL_ERROR]
          example: VALIDATION_ERROR
        message:
          type: string
          example: Invalid request

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Conflict:
      description: Resource already exists
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    InternalError:
      description: Unexpected server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
