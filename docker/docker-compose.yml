name: factory-manager

services:
  mongo:
    image: mongo:8
    container_name: factory-manager-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  core-rest-service:
    build:
      context: ../microservices/core-rest-service
      target: development
    container_name: factory-manager-core-rest
    ports:
      - "3000:3000"
    env_file:
      - ../microservices/core-rest-service/.env
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/factory-manager
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
