name: Coordinator Service CI

on:
  pull_request:
    paths:
      - "microservices/coordinator-service/**"
      - ".github/workflows/coordinator-service.yml"

  push:
    branches: ["main"]
    paths:
      - "microservices/coordinator-service/**"

  workflow_dispatch:

defaults:
  run:
    working-directory: microservices/coordinator-service

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: microservices/coordinator-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: microservices/coordinator-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: microservices/coordinator-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: microservices/coordinator-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate docs
        run: npm run docs
        
      - name: Upload docs artifact
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-service-docs
          path: microservices/coordinator-service/docs
          retention-days: 7