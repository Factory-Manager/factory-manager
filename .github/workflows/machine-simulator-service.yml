name: Machine Simulator Service CI

on:
  pull_request:
    paths:
      - "microservices/machine-simulator-service/**"
      - ".github/workflows/machine-simulator-service.yml"

  push:
    branches: ["main"]
    paths:
      - "microservices/machine-simulator-service/**"

  workflow_dispatch:

defaults:
  run:
    working-directory: microservices/machine-simulator-service

jobs:
  quality:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: microservices/machine-simulator-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: quality

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: microservices/machine-simulator-service/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage