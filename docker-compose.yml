name: factory-manager

services:
  mongo:
    image: mongo:7
    container_name: factory-manager-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: factory-manager-mqtt
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf

  core-rest-service:
    build:
      context: ./microservices/core-rest-service
    container_name: factory-manager-core-rest
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/factory-manager
    depends_on:
      - mongo
    restart: unless-stopped

volumes:
  mongo_data:
