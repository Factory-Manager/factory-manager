name: factory-manager

services:
  mongo:
    image: mongo:8
    container_name: factory-manager-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mqtt-broker:
    image: eclipse-mosquitto:2
    container_name: factory-manager-mqtt
    ports:
      - "1883:1883"
    command: mosquitto -c /mosquitto-no-auth.conf

volumes:
  mongo_data:
